spring:
  profiles:
    active: dev
  application:
    name: oes-platform
  config:
    import:
      - optional:nacos:oes-platform.yml
      - optional:nacos:oes-platform-${spring.profiles.active}.yml

server:
  port: 8080

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

myla:
  gateway:
    driver-dir: ./drivers
  security:
    jwt-secret: ${JWT_SECRET:change-me-in-production}
    jwt-expiration: 7200
