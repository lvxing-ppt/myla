spring:
  datasource:
    url: jdbc:h2:mem:myla;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: never
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    publisher-confirm-type: correlated
    listener:
      simple:
        acknowledge-mode: manual
        auto-startup: false
        retry:
          enabled: true
          max-attempts: 3
  redis:
    host: localhost
    port: 6379
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

logging:
  level:
    com.myla: DEBUG

myla:
  gateway:
    driver-dir: ./drivers
  security:
    jwt-secret: dev-secret-key-do-not-use-in-production
    jwt-expiration: 7200
