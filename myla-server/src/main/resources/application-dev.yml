spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/myla?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: root
    password: root
    publisher-confirm-type: correlated
    listener:
      simple:
        acknowledge-mode: manual
        auto-startup: true
        retry:
          enabled: true
          max-attempts: 3
  redis:
    host: 127.0.0.1
    port: 6379
    password: root

logging:
  level:
    com.myla: DEBUG

myla:
  gateway:
    driver-dir: ./drivers
    instruments:
      # ========== VITEK 2 仪器接入配置 (Demo) ==========
      - driver-id: vitek2-v1.0
        instrument-id: VITEK2-LAB1-001
        channel:
          type: TCP
          port: 19001
        splitter-type: ASTM
        parser-type: vitek2-parser

      # ========== 测试仪器 P2 ==========
      - driver-id: vitek2-v1.0          # 复用 VITEK 2 驱动（同协议）
        instrument-id: P2
        channel:
          type: TCP
          port: 19002                  # 不同端口，互不干扰
        splitter-type: ASTM
        parser-type: vitek2-parser
  security:
    jwt-secret: dev-secret-key-do-not-use-in-production
    jwt-expiration: 7200
