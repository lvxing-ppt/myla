spring:
  datasource:
    url: jdbc:mysql://localhost:3306/myla?useUnicode=true&characterEncoding=utf8mb4
    username: ${DB_USER:myla}
    password: ${DB_PASS:change-me}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBIT_USER:myla}
    password: ${RABBIT_PASS:change-me}
  redis:
    host: localhost
    port: 6379
    password: ${REDIS_PASS:}

server:
  port: 8080
  tomcat:
    max-threads: 200
    min-spare-threads: 20

logging:
  level:
    com.myla: INFO
  file:
    path: /opt/myla/logs

myla:
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-expiration: 7200
  gateway:
    driver-dir: /opt/myla/drivers
