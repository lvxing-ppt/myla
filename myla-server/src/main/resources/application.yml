spring:
  profiles:
    active: dev
  application:
    name: myla-platform

server:
  port: 8080

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

myla:
  gateway:
    driver-dir: ./drivers
  security:
    jwt-secret: ${JWT_SECRET:change-me-in-production}
    jwt-expiration: 7200
